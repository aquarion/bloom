services:
  app:
    build: .
    ports:
      - "${OCTANE_PORT:-8000}:${OCTANE_PORT:-8000}"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - "storage:/app/storage"
      - "./public:/var/www/html/public"
    restart: unless-stopped
  mysql:
    image: "mariadb:11.4"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-bloom}"
      MYSQL_USER: "${DB_USERNAME:-bloom}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret}"
    volumes:
      - "mariadb_data:/var/lib/mysql"
    healthcheck:
      test:
        - CMD-SHELL
        - "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: "redis:7.4.9-alpine"
    volumes:
      - "redis_data:/data"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  mailpit:
    image: "axllent/mailpit:latest"
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
  vite:
    build:
      context: .
      target: build
    # Matches the uid:gid the `build` stage chowns node_modules/vendor/
    # bootstrap/cache to. Without this the container runs as root and
    # Wayfinder/icon-generation write root-owned files into the
    # bind-mounted checkout below.
    user: "1000:1000"
    working_dir: /var/www/html
    command: ["npm", "run", "dev"]
    env_file: .env
    environment:
      LARAVEL_SAIL: 1
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ".:/var/www/html"
      # Anonymous volumes: keep the image's own --no-dev-consistent vendor/
      # node_modules/cache instead of the host's dev install (see commit
      # message). They're only populated from the image on first creation,
      # so after changing composer.json/package.json you need
      # `sail up --build --renew-anon-volumes vite` to pick up the change,
      # not just a plain rebuild.
      - "/var/www/html/node_modules"
      - "/var/www/html/vendor"
      - "/var/www/html/bootstrap/cache"
    restart: unless-stopped
volumes:
  storage: null
  mariadb_data: null
  redis_data: null
  sail-mysql:
    driver: local
