name: "[Dependabot] Release on main merge"

# Dependabot security updates target main directly (target-branch in
# dependabot.yml only applies to version updates), so they merge via
# dependabot-auto-merge.yml instead of the dependabot-updates -> weekly
# release flow. ci.yml's push trigger only covers dependabot-updates, so
# the merge commit landing on main never gets check-runs of its own (the
# only check-run on it would be this workflow's own job) - so instead of
# polling the push commit, look up the pull request this commit came
# from and verify that PR's head commit checks actually passed.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  check-eligible:
    if: github.event.head_commit.author.username == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      eligible: ${{ steps.wait.outputs.eligible }}

    steps:
      - name: Find the merged pull request for this commit
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/${SHA}/pulls" --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::No pull request found for commit ${SHA}; cannot verify checks, skipping release."
            exit 0
          fi
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for the merged PR's checks and confirm success
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.find_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Waiting up to 15 minutes for checks on PR #${PR_NUMBER} (${HEAD_SHA}) to settle..."
          for _ in $(seq 1 30); do
            runs=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" --jq '.check_runs')
            total=$(echo "$runs" | jq 'length')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              break
            fi
            sleep 30
          done

          runs=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" --jq '.check_runs')
          total=$(echo "$runs" | jq 'length')
          pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
          failed=$(echo "$runs" | jq '[.[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | length')

          if [ "$total" -eq 0 ] || [ "$pending" -gt 0 ]; then
            echo "::error::No completed checks found for PR #${PR_NUMBER} (${HEAD_SHA}) after waiting - refusing to release without confirmation."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$failed" -gt 0 ]; then
            echo "One or more checks on PR #${PR_NUMBER} (${HEAD_SHA}) did not pass, skipping release."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "All checks green for PR #${PR_NUMBER} (${HEAD_SHA}), proceeding to release."
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  release:
    needs: check-eligible
    if: needs.check-eligible.outputs.eligible == 'true'
    concurrency:
      group: release-tag
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version_bump: patch
    secrets: inherit # pragma: allowlist secret
