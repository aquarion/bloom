name: "[Auto] Merge Dependabot Updates"

on:
  # pull_request_target, not pull_request: GitHub withholds custom repo
  # secrets (and gives a read-only GITHUB_TOKEN) from workflow runs
  # triggered by a PR that Dependabot itself opened/updated, even same-repo
  # ones - so MERGE_TOKEN below would silently resolve empty under plain
  # pull_request. This job never checks out or runs code from the PR head
  # (it only calls the GitHub API against the PR by number), so running it
  # in the base repo's context is safe.
  pull_request_target:
    # dependabot.yml targets version updates at dependabot-updates, but
    # GitHub's automatic security updates ignore target-branch and always
    # open against the default branch - so main needs the same handling.
    branches: [dependabot-updates, main]

permissions: {}

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    uses: istic/shared-workflows/.github/workflows/auto-merge-dependabot.yml@main
    permissions:
      pull-requests: write
      contents: write
    secrets:
      # A real-identity token, not the default GITHUB_TOKEN: pushes made with
      # GITHUB_TOKEN don't trigger other workflow runs, so without this the
      # merge commit landing on dependabot-updates never re-triggers CI on
      # the aggregate PR into main, and its checks stay stuck at zero forever.
      MERGE_TOKEN: ${{ secrets.REBASE_TOKEN }}
