services:
  app:
    build: .
    ports:
      - "${OCTANE_PORT:-8000}:${OCTANE_PORT:-8000}"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - "storage:/app/storage"
    restart: unless-stopped
  mysql:
    image: "mariadb:11.4"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-bloom}"
      MYSQL_USER: "${DB_USERNAME:-bloom}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret}"
    volumes:
      - "mariadb_data:/var/lib/mysql"
    healthcheck:
      test:
        - CMD-SHELL
        - "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: "redis:7.4.9-alpine"
    volumes:
      - "redis_data:/data"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  mailpit:
    image: "axllent/mailpit:latest"
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
volumes:
  storage: null
  mariadb_data: null
  redis_data: null
  sail-mysql:
    driver: local
